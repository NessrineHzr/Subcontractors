# .github/workflows/ci-cd.yml
name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1 Installation des dépendances JS et PHP
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      # Partie JS
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances JS
        run: npm ci

      # Partie PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Installer Composer
        run: composer install --no-progress --no-suggest --prefer-dist

  # 2 Lancement des tests
  test:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.1', '8.2']
        node-versions: ['18']
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # PHP : tests unitaires
      - name: Setup PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

      # JS : lint + tests
      - name: Setup Node.js ${{ matrix.node-versions }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-versions }}
      - name: Linter JS
        run: npm run lint
      - name: Tests JS
        run: npm test

  # 3 Build front-end JS
  build-js:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: js-dist
          path: dist/

  # 4 Déploiement
  deploy:
    needs: [build-js]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupérer l’artifact JS
        uses: actions/download-artifact@v3
        with:
          name: js-dist
          path: ./public/

      - name: Copier la partie PHP
        run: |
          rsync -av --exclude='.git*' . user@serveur:/var/www/mon-app/

      - name: Copier la partie JS
        run: |
          rsync -av public/ user@serveur:/var/www/mon-app/public/

      - name: Purger cache (si applicable)
        run: ssh user@serveur 'cd /var/www/mon-app && php artisan cache:clear'
